version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_password_123
      POSTGRES_DB: chatwoot_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rails:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    volumes:
      - rails_storage:/app/storage
      - custom_assets:/app/custom_storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-c", "mkdir -p /app/public/brand-assets /app/public/packs/brand-assets /app/app/javascript/dashboard/assets/images /app/app/javascript/widget/assets/images 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/brand-assets/logo.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/brand-assets/logo_dark.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/brand-assets/logo_thumbnail.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/packs/brand-assets/logo.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/packs/brand-assets/logo_dark.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/public/packs/brand-assets/logo_thumbnail.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/app/javascript/dashboard/assets/images/bubble-logo.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.svg /app/app/javascript/widget/assets/images/logo.svg 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/brand-assets/logo.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/brand-assets/logo_dark.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/brand-assets/logo_thumbnail.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/favicon.ico 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/favicon-16x16.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/favicon-32x32.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/favicon-96x96.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/favicon-512x512.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/apple-icon.png 2>/dev/null; cp /app/custom_storage/sinhuellas_logo.png /app/public/apple-touch-icon.png 2>/dev/null; cp /app/custom_storage/custom.css /app/public/custom.css 2>/dev/null; cp /app/custom_storage/vueapp.html.erb /app/app/views/layouts/vueapp.html.erb 2>/dev/null; mkdir -p /app/app/views/super_admin/application /app/app/views/super_admin/devise/sessions /app/app/views/super_admin/instance_statuses /app/app/controllers/super_admin 2>/dev/null; cp /app/custom_storage/_navigation.html.erb /app/app/views/super_admin/application/_navigation.html.erb 2>/dev/null; cp /app/custom_storage/instance_status_show.html.erb /app/app/views/super_admin/instance_statuses/show.html.erb 2>/dev/null; cp /app/custom_storage/sessions_new.html.erb /app/app/views/super_admin/devise/sessions/new.html.erb 2>/dev/null; bundle exec rails s -p 3000 -b 0.0.0.0"]
    entrypoint: docker/entrypoints/rails.sh

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    volumes:
      - rails_storage:/app/storage
      - custom_assets:/app/custom_storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  postgres_data:
  redis_data:
  rails_storage:
  custom_assets:
