services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_password_123
      POSTGRES_DB: chatwoot_production
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rails:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file: .env
    volumes:
      - ./data/storage:/app/storage
      - ./data/storage/sinhuellas_logo.png:/app/public/sinhuellas_logo.png:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/brand-assets/logo.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/brand-assets/logo_dark.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/brand-assets/logo_thumbnail.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/packs/brand-assets/logo.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/packs/brand-assets/logo_dark.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/public/packs/brand-assets/logo_thumbnail.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/app/javascript/dashboard/assets/images/bubble-logo.svg:ro
      - ./data/storage/sinhuellas_logo.svg:/app/app/javascript/widget/assets/images/logo.svg:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/brand-assets/logo.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/brand-assets/logo_dark.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/brand-assets/logo_thumbnail.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/favicon.ico:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/favicon-16x16.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/favicon-32x32.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/favicon-96x96.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/favicon-512x512.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/apple-icon.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/apple-touch-icon.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/packs/favicon-16x16.png:ro
      - ./data/storage/sinhuellas_logo.png:/app/public/packs/favicon-32x32.png:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    entrypoint: docker/entrypoints/rails.sh

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file: .env
    volumes:
      - ./data/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
