version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot_password_123
      POSTGRES_DB: chatwoot_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rails:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    volumes:
      - rails_storage:/app/storage
      - custom_assets:/app/custom_storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-c", "cp /app/custom_storage/custom.css /app/public/custom.css 2>/dev/null; cp /app/custom_storage/vueapp.html.erb /app/app/views/layouts/vueapp.html.erb 2>/dev/null; mkdir -p /app/app/views/super_admin/application 2>/dev/null; cp /app/custom_storage/_navigation.html.erb /app/app/views/super_admin/application/_navigation.html.erb 2>/dev/null; bundle exec rails s -p 3000 -b 0.0.0.0"]
    entrypoint: docker/entrypoints/rails.sh

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    volumes:
      - rails_storage:/app/storage
      - custom_assets:/app/custom_storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  postgres_data:
  redis_data:
  rails_storage:
  custom_assets:
